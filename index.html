<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>StudyPomo 讀書番茄鐘</title>
<style>
:root{
  --bg:#14161c; --card:#1d2029; --card2:#252935; --line:#323746;
  --text:#e8eaf0; --muted:#9aa1b2; --accent:#ff7a59; --accent2:#ffb199;
  --ok:#5fd3a0; --danger:#ff6b6b; --shadow:0 6px 24px rgba(0,0,0,.35);
}
:root[data-theme="light"]{
  --bg:#f4f5f8; --card:#ffffff; --card2:#f0f1f5; --line:#dfe2ea;
  --text:#1f2330; --muted:#646b7d; --accent:#e85d3b; --accent2:#f08d72;
  --ok:#219e6b; --danger:#d64545; --shadow:0 6px 20px rgba(30,35,50,.08);
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);
  font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;line-height:1.5}
header{display:flex;align-items:center;justify-content:space-between;padding:16px 20px;max-width:1100px;margin:0 auto}
header h1{font-size:20px;margin:0;letter-spacing:.5px}
header h1 span{color:var(--accent)}
.hbtns{display:flex;gap:8px}
button{font:inherit;color:inherit;cursor:pointer;border:1px solid var(--line);background:var(--card2);
  border-radius:10px;padding:8px 14px;transition:.15s}
button:hover{border-color:var(--accent)}
button:disabled{opacity:.4;cursor:not-allowed}
button.primary{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:700}
button.danger{color:var(--danger)}
button.icon{padding:6px 10px}
input,select{font:inherit;color:var(--text);background:var(--card2);border:1px solid var(--line);
  border-radius:8px;padding:7px 10px;min-width:0}
main{max-width:1100px;margin:0 auto;padding:0 20px 40px;display:grid;gap:18px;
  grid-template-columns:minmax(300px,420px) 1fr}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;box-shadow:var(--shadow)}
.card h2{font-size:15px;margin:0 0 12px;color:var(--muted);font-weight:600}
.timer{text-align:center}
.modes{display:flex;justify-content:center;gap:6px;margin-bottom:10px}
.mode{font-size:13px;padding:4px 12px;border-radius:99px;border:1px solid var(--line);color:var(--muted)}
.mode.on{background:var(--accent);border-color:var(--accent);color:#fff}
.ring{position:relative;width:240px;height:240px;margin:6px auto 10px}
.ring svg{transform:rotate(-90deg)}
.ring .time{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring .time b{font-size:52px;font-variant-numeric:tabular-nums;letter-spacing:1px}
.ring .time small{color:var(--muted)}
.subjrow{display:flex;gap:8px;justify-content:center;align-items:center;margin:8px 0 14px}
.ctrls{display:flex;gap:8px;justify-content:center}
.ctrls .primary{min-width:110px}
.hint{color:var(--muted);font-size:12px;margin-top:10px}
.right{display:grid;gap:18px;align-content:start}
.goal .nums{display:flex;align-items:baseline;gap:8px;margin-bottom:8px}
.goal .nums b{font-size:28px}
.bar{height:12px;border-radius:99px;background:var(--card2);overflow:hidden}
.bar>i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2));border-radius:99px;transition:width .4s}
.today-row{display:grid;grid-template-columns:90px 1fr 64px;gap:10px;align-items:center;margin:6px 0;font-size:14px}
.today-row .bar{height:10px}
.today-row .v{text-align:right;color:var(--muted);font-variant-numeric:tabular-nums}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px;vertical-align:middle}
.legend{display:flex;flex-wrap:wrap;gap:10px;font-size:12px;color:var(--muted);margin-top:8px}
.tag{font-size:11px;padding:1px 6px;border-radius:6px;background:var(--card2);color:var(--muted);border:1px solid var(--line)}
.empty{color:var(--muted);font-size:14px;padding:6px 0}
#weekChart{width:100%;height:auto;display:block}
.full{grid-column:1/-1}
.histhead{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:8px}
.histhead h2{margin:0}
table{width:100%;border-collapse:collapse;font-size:14px}
td,th{padding:8px 6px;border-bottom:1px solid var(--line);text-align:left}
th{color:var(--muted);font-weight:500}
td.num{font-variant-numeric:tabular-nums}
.addform{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:10px;background:var(--card2);border-radius:10px;margin-bottom:10px}
.addform[hidden]{display:none}
dialog{background:var(--card);color:var(--text);border:1px solid var(--line);border-radius:16px;padding:20px;width:min(440px,92vw)}
dialog::backdrop{background:rgba(0,0,0,.5)}
dialog h3{margin:0 0 14px}
.field{display:flex;justify-content:space-between;align-items:center;gap:12px;margin:10px 0}
.field input{width:90px;text-align:right}
.subjlist{display:grid;gap:6px;margin:8px 0}
.subjitem{display:flex;align-items:center;justify-content:space-between;padding:6px 10px;background:var(--card2);border-radius:8px}
.drow{display:flex;justify-content:flex-end;gap:8px;margin-top:16px}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(20px);background:var(--card2);
  border:1px solid var(--accent);padding:10px 18px;border-radius:12px;opacity:0;pointer-events:none;transition:.25s;box-shadow:var(--shadow)}
.toast.show{opacity:1;transform:translateX(-50%)}
@media (max-width:820px){
  main{grid-template-columns:1fr}
  .ring{width:210px;height:210px}
  .ring svg{width:210px;height:210px}
  .ring .time b{font-size:44px}
  .hide-sm{display:none}
}
</style>
</head>
<body>
<header>
  <h1>🍅 Study<span>Pomo</span></h1>
  <div class="hbtns">
    <button class="icon" id="themeBtn" title="切換深淺色">🌙</button>
    <button id="subjBtn">科目</button>
    <button id="setBtn">設定</button>
  </div>
</header>

<main>
  <section class="card timer">
    <div class="modes">
      <span class="mode" data-m="focus">專注</span>
      <span class="mode" data-m="short">短休息</span>
      <span class="mode" data-m="long">長休息</span>
    </div>
    <div class="ring">
      <svg width="240" height="240" viewBox="0 0 240 240">
        <circle cx="120" cy="120" r="108" fill="none" stroke="var(--card2)" stroke-width="12"/>
        <circle id="prog" cx="120" cy="120" r="108" fill="none" stroke="var(--accent)" stroke-width="12"
          stroke-linecap="round" stroke-dasharray="678.58" stroke-dashoffset="0"/>
      </svg>
      <div class="time"><b id="clock">50:00</b><small id="roundTxt">第 1 輪</small></div>
    </div>
    <div class="subjrow">
      <label for="subjSel">科目</label>
      <select id="subjSel"></select>
    </div>
    <div class="ctrls">
      <button class="primary" id="startBtn">開始</button>
      <button id="skipBtn">跳過</button>
      <button id="stopBtn" class="danger">結束</button>
    </div>
    <div class="hint">空白鍵：開始／暫停</div>
  </section>

  <div class="right">
    <section class="card goal">
      <h2>本週目標</h2>
      <div class="nums"><b id="goalH">0</b><span id="goalOf">/ 24 小時</span><span id="goalPct" style="margin-left:auto;color:var(--accent)">0%</span></div>
      <div class="bar"><i id="goalBar" style="width:0"></i></div>
    </section>
    <section class="card">
      <h2>今日各科 <span id="todayTotal" style="float:right"></span></h2>
      <div id="todayList"></div>
    </section>
    <section class="card">
      <h2>本週每日讀書時數</h2>
      <svg id="weekChart" viewBox="0 0 560 230"></svg>
      <div class="legend" id="legend"></div>
    </section>
  </div>

  <section class="card full">
    <div class="histhead">
      <h2>歷史紀錄</h2>
      <div style="display:flex;gap:8px">
        <button id="addBtn">＋ 補登</button>
        <button id="csvBtn">匯出 CSV</button>
      </div>
    </div>
    <div class="addform" id="addForm" hidden>
      <select id="addSubj"></select>
      <input type="date" id="addDate">
      <input type="number" id="addMin" min="1" max="600" placeholder="分鐘" style="width:90px">
      <button class="primary" id="addOk">新增</button>
      <button id="addCancel">取消</button>
    </div>
    <table>
      <thead><tr><th>日期時間</th><th>科目</th><th>分鐘</th><th></th></tr></thead>
      <tbody id="hist"></tbody>
    </table>
    <div class="empty" id="histEmpty">還沒有紀錄，開始第一顆番茄吧！</div>
  </section>
</main>

<dialog id="setDlg">
  <h3>設定</h3>
  <div class="field"><span>專注（分鐘）</span><input type="number" id="sFocus" min="1" max="180"></div>
  <div class="field"><span>短休息（分鐘）</span><input type="number" id="sShort" min="1" max="60"></div>
  <div class="field"><span>長休息（分鐘）</span><input type="number" id="sLong" min="1" max="60"></div>
  <div class="field"><span>幾輪專注後長休息</span><input type="number" id="sInt" min="2" max="8"></div>
  <div class="field"><span>每週目標（小時）</span><input type="number" id="sGoal" min="1" max="100"></div>
  <div class="drow"><button id="setCancel">取消</button><button class="primary" id="setSave">儲存</button></div>
</dialog>

<dialog id="subjDlg">
  <h3>科目管理</h3>
  <div class="subjlist" id="subjList"></div>
  <div style="display:flex;gap:8px"><input id="newSubj" placeholder="新科目名稱" maxlength="12" style="flex:1"><button class="primary" id="newSubjBtn">新增</button></div>
  <div class="drow"><button id="subjClose">完成</button></div>
</dialog>

<div class="toast" id="toast"></div>

<script>
const KEY = 'studypomo_v1';
const COLORS = ['#ff7a59','#5fa8ff','#5fd3a0','#ffc857','#c48bff','#ff6fae','#4fd1d9','#a3b86c'];
const DEFAULT = {
  settings:{focus:50, short:10, long:20, interval:4, goal:24},
  subjects:['線性代數','離散數學','資料結構','演算法','作業系統','計算機組織']
    .map((n,i)=>({id:'s'+i, name:n, color:COLORS[i], archived:false})),
  sessions:[],
  timer:{mode:'focus', running:false, endsAt:0, remaining:null, round:1, subjectId:'s0', startedAt:0},
  theme:'dark'
};

let S;
try{ S = JSON.parse(localStorage.getItem(KEY)) || null; }catch(e){ S = null; }
if(!S){ S = JSON.parse(JSON.stringify(DEFAULT)); }
const save = ()=>{ try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){} };

const $ = id => document.getElementById(id);
const pad = n => String(n).padStart(2,'0');
const dayKey = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const modeLen = m => (m==='focus'?S.settings.focus : m==='short'?S.settings.short : S.settings.long)*60000;
const subjById = id => S.subjects.find(s=>s.id===id);
const fmtH = min => (min/60).toFixed(1);
const fmtMin = min => min>=60 ? `${Math.floor(min/60)} 小時 ${min%60} 分` : `${min} 分`;

function toast(msg){ const t=$('toast'); t.textContent=msg; t.classList.add('show'); clearTimeout(toast.h); toast.h=setTimeout(()=>t.classList.remove('show'),2600); }

/* ---------- 提示音 ---------- */
let actx;
function beep(){
  try{
    actx = actx || new (window.AudioContext||window.webkitAudioContext)();
    [0,0.35,0.7].forEach(t=>{
      const o=actx.createOscillator(), g=actx.createGain();
      o.frequency.value=880; o.type='sine';
      g.gain.setValueAtTime(0.0001, actx.currentTime+t);
      g.gain.exponentialRampToValueAtTime(0.3, actx.currentTime+t+0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, actx.currentTime+t+0.3);
      o.connect(g).connect(actx.destination); o.start(actx.currentTime+t); o.stop(actx.currentTime+t+0.32);
    });
  }catch(e){}
}
function notify(msg){
  try{ if('Notification' in window && Notification.permission==='granted') new Notification('StudyPomo', {body:msg}); }catch(e){}
}

/* ---------- 計時器 ---------- */
const T = () => S.timer;
function remainingMs(){
  const t=T();
  if(t.running) return Math.max(0, t.endsAt - Date.now());
  return t.remaining==null ? modeLen(t.mode) : t.remaining;
}
function totalMs(){
  const t=T();
  return (t.remaining==null && !t.running) ? modeLen(t.mode) : (t.total || modeLen(t.mode));
}
function start(){
  const t=T();
  if(t.mode==='focus' && !subjById(t.subjectId)){ toast('請先選擇科目'); return; }
  const rem = remainingMs();
  if(t.remaining==null){ t.total = modeLen(t.mode); if(t.mode==='focus') t.startedAt = Date.now(); }
  t.endsAt = Date.now() + rem; t.running = true; t.remaining = rem;
  try{ if('Notification' in window && Notification.permission==='default') Notification.requestPermission(); }catch(e){}
  try{ actx = actx || new (window.AudioContext||window.webkitAudioContext)(); actx.resume && actx.resume(); }catch(e){}
  save(); render();
}
function pause(){ const t=T(); t.remaining = remainingMs(); t.running=false; save(); render(); }
function nextMode(fromFocus){
  const t=T();
  if(fromFocus){
    t.mode = (t.round % S.settings.interval === 0) ? 'long' : 'short';
  }else{
    if(t.mode==='long' || t.mode==='short') t.round += 1;
    t.mode = 'focus';
  }
  t.running=false; t.remaining=null; t.endsAt=0;
}
function addSession(subjectId, startTs, minutes, manual=false){
  S.sessions.push({id:'r'+Date.now()+Math.random().toString(36).slice(2,6), subjectId, start:startTs, minutes, manual});
}
function complete(){
  const t=T();
  if(t.mode==='focus'){
    const min = Math.round(totalMs()/60000);
    addSession(t.subjectId, t.startedAt || (Date.now()-min*60000), min);
    const name = subjById(t.subjectId)?.name || '';
    beep(); notify(`專注完成：${name} ${min} 分鐘，休息一下吧！`); toast(`🎉 已記錄 ${name} ${min} 分鐘`);
    nextMode(true);
  }else{
    beep(); notify('休息結束，回來專注！'); toast('休息結束，準備下一輪');
    nextMode(false);
  }
  save(); render(); renderStats();
}
function skip(){
  const t=T();
  if(t.mode==='focus'){ toast('專注中不能跳過，可以按「結束」'); return; }
  nextMode(false); save(); render();
}
function stop(){
  const t=T();
  if(t.mode==='focus'){
    const elapsedMin = Math.floor((totalMs() - remainingMs())/60000);
    if(t.remaining==null && !t.running){ return; }
    if(elapsedMin>=1){
      if(confirm(`已專注 ${elapsedMin} 分鐘，要記錄這段時間嗎？`)){
        addSession(t.subjectId, t.startedAt || Date.now()-elapsedMin*60000, elapsedMin);
        toast(`已記錄 ${elapsedMin} 分鐘`);
      }
    }else if(!confirm('不到 1 分鐘，不會記錄。確定結束？')) return;
    t.running=false; t.remaining=null; t.endsAt=0;
  }else{
    nextMode(false);
  }
  save(); render(); renderStats();
}

function render(){
  const t=T(), rem=remainingMs(), total=totalMs();
  const mm = Math.floor(rem/60000), ss = Math.floor(rem%60000/1000);
  $('clock').textContent = `${pad(mm)}:${pad(ss)}`;
  const C = 678.58;
  $('prog').style.strokeDashoffset = C * (1 - rem/total);
  $('prog').setAttribute('stroke', t.mode==='focus' ? 'var(--accent)' : 'var(--ok)');
  document.querySelectorAll('.mode').forEach(e=>e.classList.toggle('on', e.dataset.m===t.mode));
  $('roundTxt').textContent = t.mode==='focus' ? `第 ${t.round} 輪` : (t.mode==='long'?'長休息':'短休息');
  $('startBtn').textContent = t.running ? '暫停' : (t.remaining!=null && t.remaining<total ? '繼續' : '開始');
  $('subjSel').disabled = t.running || (t.mode==='focus' && t.remaining!=null);
  $('skipBtn').disabled = t.mode==='focus';
  const label = t.mode==='focus' ? (subjById(t.subjectId)?.name||'專注') : '休息';
  document.title = t.running ? `${pad(mm)}:${pad(ss)} ${label}｜StudyPomo` : 'StudyPomo 讀書番茄鐘';
}
function tick(){ if(T().running){ if(remainingMs()<=0) complete(); else render(); } }
setInterval(tick, 250);
document.addEventListener('visibilitychange', tick);

/* ---------- 科目選單 ---------- */
function fillSubjSelects(){
  const act = S.subjects.filter(s=>!s.archived);
  const opts = act.map(s=>`<option value="${s.id}">${esc(s.name)}</option>`).join('');
  $('subjSel').innerHTML = opts || '<option value="">（請先新增科目）</option>';
  $('addSubj').innerHTML = opts;
  if(!act.find(s=>s.id===T().subjectId)) T().subjectId = act[0]?.id || '';
  $('subjSel').value = T().subjectId;
}
function esc(s){ return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

/* ---------- 統計 ---------- */
function weekDays(){
  const now=new Date(); const d=new Date(now.getFullYear(),now.getMonth(),now.getDate());
  d.setDate(d.getDate() - (d.getDay()+6)%7);
  return [...Array(7)].map((_,i)=>{ const x=new Date(d); x.setDate(d.getDate()+i); return x; });
}
function renderStats(){
  const todayK = dayKey(new Date());
  const days = weekDays(); const keys = days.map(dayKey);
  const byDay = {}; keys.forEach(k=>byDay[k]={});
  const today = {};
  S.sessions.forEach(r=>{
    const k = dayKey(new Date(r.start));
    if(byDay[k]) byDay[k][r.subjectId] = (byDay[k][r.subjectId]||0) + r.minutes;
    if(k===todayK) today[r.subjectId] = (today[r.subjectId]||0) + r.minutes;
  });

  // 每週目標
  const weekMin = keys.reduce((a,k)=>a+Object.values(byDay[k]).reduce((x,y)=>x+y,0),0);
  const goalMin = S.settings.goal*60, pct = Math.min(100, Math.round(weekMin/goalMin*100));
  $('goalH').textContent = fmtH(weekMin);
  $('goalOf').textContent = `/ ${S.settings.goal} 小時`;
  $('goalPct').textContent = pct + '%';
  $('goalBar').style.width = pct + '%';

  // 今日各科
  const tIds = Object.keys(today).sort((a,b)=>today[b]-today[a]);
  const tMax = Math.max(1, ...Object.values(today));
  const tTotal = Object.values(today).reduce((a,b)=>a+b,0);
  $('todayTotal').textContent = tTotal ? `共 ${fmtMin(tTotal)}` : '';
  $('todayList').innerHTML = tIds.length ? tIds.map(id=>{
    const s = subjById(id)||{name:'(已刪除)',color:'#888'};
    return `<div class="today-row"><span><i class="dot" style="background:${s.color}"></i>${esc(s.name)}</span>
      <div class="bar"><i style="width:${today[id]/tMax*100}%;background:${s.color}"></i></div>
      <span class="v">${today[id]} 分</span></div>`;
  }).join('') : '<div class="empty">今天還沒開始讀書</div>';

  // 本週圖表
  const W=560,H=230,L=36,B=30,Tp=14, cw=(W-L-10)/7, bw=Math.min(44,cw*0.6);
  const totals = keys.map(k=>Object.values(byDay[k]).reduce((a,b)=>a+b,0));
  const maxH = Math.max(2, Math.ceil(Math.max(...totals)/60));
  const y = min => H-B - (min/60)/maxH*(H-B-Tp);
  let g = '';
  for(let h=0;h<=maxH;h+=Math.max(1,Math.ceil(maxH/4))){
    g += `<line x1="${L}" x2="${W-6}" y1="${y(h*60)}" y2="${y(h*60)}" stroke="var(--line)" stroke-width="1"/>
          <text x="${L-6}" y="${y(h*60)+4}" text-anchor="end" font-size="11" fill="var(--muted)">${h}h</text>`;
  }
  const names=['一','二','三','四','五','六','日'];
  const used = new Set();
  keys.forEach((k,i)=>{
    const x = L + cw*i + (cw-bw)/2; let acc=0;
    S.subjects.forEach(s=>{
      const m = byDay[k][s.id]; if(!m) return; used.add(s.id);
      const y1=y(acc+m), y0=y(acc); acc+=m;
      g += `<rect x="${x}" y="${y1}" width="${bw}" height="${Math.max(1,y0-y1)}" fill="${s.color}" rx="3"><title>${esc(s.name)} ${m} 分</title></rect>`;
    });
    const isToday = k===todayK;
    g += `<text x="${x+bw/2}" y="${H-12}" text-anchor="middle" font-size="12" fill="${isToday?'var(--accent)':'var(--muted)'}" font-weight="${isToday?700:400}">${names[i]}</text>`;
    if(totals[i]) g += `<text x="${x+bw/2}" y="${y(totals[i])-5}" text-anchor="middle" font-size="11" fill="var(--text)">${fmtH(totals[i])}</text>`;
  });
  $('weekChart').innerHTML = g;
  $('legend').innerHTML = S.subjects.filter(s=>used.has(s.id)).map(s=>`<span><i class="dot" style="background:${s.color}"></i>${esc(s.name)}</span>`).join('');

  // 歷史
  const list = [...S.sessions].sort((a,b)=>b.start-a.start).slice(0,100);
  $('histEmpty').style.display = list.length ? 'none' : 'block';
  $('hist').innerHTML = list.map(r=>{
    const d=new Date(r.start), s=subjById(r.subjectId)||{name:'(已刪除)',color:'#888'};
    const when = r.manual ? `${d.getMonth()+1}/${d.getDate()} <span class="tag">補登</span>` : `${d.getMonth()+1}/${d.getDate()} ${pad(d.getHours())}:${pad(d.getMinutes())}`;
    return `<tr><td class="num">${when}</td>
      <td><i class="dot" style="background:${s.color}"></i>${esc(s.name)}</td>
      <td class="num">${r.minutes}</td>
      <td style="text-align:right"><button class="icon danger" data-del="${r.id}" title="刪除">✕</button></td></tr>`;
  }).join('');
}

/* ---------- 事件 ---------- */
$('startBtn').onclick = ()=> T().running ? pause() : start();
$('skipBtn').onclick = skip;
$('stopBtn').onclick = stop;
$('subjSel').onchange = e=>{ T().subjectId = e.target.value; save(); render(); };
document.querySelectorAll('.mode').forEach(e=>e.onclick=()=>{
  const t=T(); if(t.running){ toast('請先暫停或結束'); return; }
  t.mode=e.dataset.m; t.remaining=null; save(); render();
});
document.addEventListener('keydown', e=>{
  if(e.code==='Space' && !/INPUT|SELECT|TEXTAREA|BUTTON/.test(document.activeElement.tagName) && !document.querySelector('dialog[open]')){
    e.preventDefault(); T().running ? pause() : start();
  }
});
$('hist').onclick = e=>{
  const id = e.target.dataset?.del; if(!id) return;
  if(confirm('確定刪除這筆紀錄？')){ S.sessions = S.sessions.filter(r=>r.id!==id); save(); renderStats(); }
};

// 補登
$('addBtn').onclick = ()=>{ $('addForm').hidden=false; $('addDate').value=dayKey(new Date()); $('addMin').focus(); };
$('addCancel').onclick = ()=> $('addForm').hidden=true;
$('addOk').onclick = ()=>{
  const sid=$('addSubj').value, d=$('addDate').value, m=parseInt($('addMin').value,10);
  if(!sid || !d || !(m>=1 && m<=600)){ toast('請填寫科目、日期與 1–600 分鐘'); return; }
  const [Y,M,D] = d.split('-').map(Number);
  addSession(sid, new Date(Y,M-1,D,12,0).getTime(), m, true);
  save(); renderStats(); $('addForm').hidden=true; $('addMin').value=''; toast('已補登');
};

// CSV
$('csvBtn').onclick = ()=>{
  const rows = [['日期','時間','科目','分鐘']].concat([...S.sessions].sort((a,b)=>a.start-b.start).map(r=>{
    const d=new Date(r.start); return [dayKey(d), r.manual ? '補登' : `${pad(d.getHours())}:${pad(d.getMinutes())}`, subjById(r.subjectId)?.name||'(已刪除)', r.minutes];
  }));
  const csv = '﻿' + rows.map(r=>r.map(v=>`"${String(v).replace(/"/g,'""')}"`).join(',')).join('\n');
  const a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));
  a.download=`studypomo_${dayKey(new Date())}.csv`; a.click(); URL.revokeObjectURL(a.href);
};

// 設定
$('setBtn').onclick = ()=>{
  const s=S.settings; $('sFocus').value=s.focus; $('sShort').value=s.short; $('sLong').value=s.long; $('sInt').value=s.interval; $('sGoal').value=s.goal;
  $('setDlg').showModal();
};
$('setCancel').onclick = ()=> $('setDlg').close();
$('setSave').onclick = ()=>{
  const v = (id,lo,hi)=>{ const n=parseInt($(id).value,10); return n>=lo&&n<=hi ? n : null; };
  const f=v('sFocus',1,180), sh=v('sShort',1,60), lo=v('sLong',1,60), it=v('sInt',2,8), go=v('sGoal',1,100);
  if([f,sh,lo,it,go].includes(null)){ toast('數值超出範圍，請檢查'); return; }
  S.settings={focus:f,short:sh,long:lo,interval:it,goal:go};
  if(!T().running && T().remaining==null){ /* 尚未開始的這輪直接套用新長度 */ }
  else if(!T().running) toast('設定已儲存，暫停中的這一輪維持原長度');
  save(); render(); renderStats(); $('setDlg').close(); toast('設定已儲存');
};

// 科目
function renderSubjList(){
  $('subjList').innerHTML = S.subjects.filter(s=>!s.archived).map(s=>
    `<div class="subjitem"><span><i class="dot" style="background:${s.color}"></i>${esc(s.name)}</span>
     <button class="icon danger" data-sdel="${s.id}">刪除</button></div>`).join('') || '<div class="empty">沒有科目</div>';
}
$('subjBtn').onclick = ()=>{ renderSubjList(); $('subjDlg').showModal(); };
$('subjClose').onclick = ()=> $('subjDlg').close();
$('subjList').onclick = e=>{
  const id=e.target.dataset?.sdel; if(!id) return;
  if(T().running && T().subjectId===id){ toast('這科正在計時，不能刪除'); return; }
  if(confirm('刪除科目？（歷史紀錄會保留）')){ subjById(id).archived=true; save(); renderSubjList(); fillSubjSelects(); render(); }
};
$('newSubjBtn').onclick = ()=>{
  const n=$('newSubj').value.trim(); if(!n) return;
  if(S.subjects.some(s=>!s.archived && s.name===n)){ toast('已有這個科目'); return; }
  const used = S.subjects.filter(s=>!s.archived).map(s=>s.color);
  const color = COLORS.find(c=>!used.includes(c)) || COLORS[S.subjects.length % COLORS.length];
  S.subjects.push({id:'s'+Date.now(), name:n, color, archived:false});
  $('newSubj').value=''; save(); renderSubjList(); fillSubjSelects(); render();
};
$('newSubj').onkeydown = e=>{ if(e.key==='Enter') $('newSubjBtn').click(); };

// 主題
function applyTheme(){ document.documentElement.dataset.theme=S.theme; $('themeBtn').textContent = S.theme==='dark'?'🌙':'☀️'; }
$('themeBtn').onclick = ()=>{ S.theme = S.theme==='dark'?'light':'dark'; applyTheme(); save(); };

/* ---------- 初始化 ---------- */
applyTheme(); fillSubjSelects();
if(T().running && remainingMs()<=0) complete();
render(); renderStats();
// 跨日時更新統計
setInterval(renderStats, 60000);
</script>
</body>
</html>
